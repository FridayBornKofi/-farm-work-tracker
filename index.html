<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Work Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f4f4f4;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #171717;
}

.app {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
  margin: 0;
}

.subtitle {
  color: #666;
  margin: 5px 0 20px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-top: 13px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: 600;
}

button:disabled {
  opacity: .6;
}

.message {
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}

.success {
  display: block;
  background: #e7f7e7;
}

.error {
  display: block;
  background: #ffe7e7;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.stat {
  background: #f1f1f1;
  padding: 14px;
  border-radius: 12px;
}

.stat span {
  color: #666;
  font-size: 13px;
}

.stat strong {
  display: block;
  font-size: 22px;
  margin-top: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 13px;
}

th,
td {
  padding: 9px 3px;
  text-align: left;
  border-bottom: 1px solid #eee;
}

.empty {
  text-align: center;
  color: #777;
  padding: 20px;
}
</style>
</head>

<body>

<div class="app">

<h1>Farm Work Tracker</h1>

<div class="subtitle">
Track your farm hours automatically.
</div>

<label>Farm number, optional</label>
<input id="farm" type="text" placeholder="Example: Farm 12">

<label>Date</label>
<input id="date" type="date">

<label>Work start</label>
<input id="start" type="time">

<label>Break starts</label>
<input id="breakStart" type="time">

<label>Resume from break</label>
<input id="breakEnd" type="time">

<label>Work close</label>
<input id="close" type="time">

<label>Hourly rate, optional (€)</label>
<input id="rate" type="number" step="0.01" placeholder="Unknown">

<button id="saveButton">
Add Work Day
</button>

<div id="message" class="message"></div>

<div class="stats">

<div class="stat">
<span>Total hours</span>
<strong id="totalHours">0h 0m</strong>
</div>

<div class="stat">
<span>Days worked</span>
<strong id="totalDays">0</strong>
</div>

<div class="stat">
<span>Total pay</span>
<strong id="totalPay">€0.00</strong>
</div>

<div class="stat">
<span>This month</span>
<strong id="monthHours">0h 0m</strong>
</div>

</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Farm</th>
<th>Hours</th>
<th>Pay</th>
</tr>
</thead>

<tbody id="records">
</tbody>

</table>

</div>

<script>

const SUPABASE_URL =
"https://uqjuwbddcbyoqyxlmkgg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1K6kwEhTHYJnM_OqA5Su6A_xrxejzh_";

const API =
SUPABASE_URL + "/rest/v1/farm_work";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const $ = id => document.getElementById(id);

$("date").value =
new Date().toISOString().split("T")[0];


function minutes(time) {

  const parts = time.split(":");

  return Number(parts[0]) * 60 +
         Number(parts[1]);

}


function duration(start, end) {

  let result =
    minutes(end) - minutes(start);

  if (result < 0) {
    result += 1440;
  }

  return result;

}


function calculateHours() {

  const start = $("start").value;
  const close = $("close").value;

  if (!start || !close) {
    return null;
  }

  let total =
    duration(start, close);

  const breakStart =
    $("breakStart").value;

  const breakEnd =
    $("breakEnd").value;

  if (breakStart && breakEnd) {

    total -=
      duration(breakStart, breakEnd);

  }

  return total;

}


function formatHours(totalMinutes) {

  const hours =
    Math.floor(totalMinutes / 60);

  const minutes =
    totalMinutes % 60;

  return hours + "h " + minutes + "m";

}


function message(text, type) {

  $("message").textContent = text;

  $("message").className =
    "message " + type;

}


async function loadRecords() {

  try {

    const response =
      await fetch(
        API +
        "?select=*&order=work_date.asc,created_at.asc",
        {
          headers: headers
        }
      );

    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }

    const records =
      await response.json();

    let totalMinutes = 0;
    let monthlyMinutes = 0;
    let totalPay = 0;

    const currentMonth =
      new Date()
      .toISOString()
      .slice(0, 7);

    $("records").innerHTML = "";

    records.forEach(record => {

      const minutesWorked =
        Number(record.total_minutes) || 0;

      totalMinutes +=
        minutesWorked;

      if (
        record.work_date &&
        record.work_date.startsWith(currentMonth)
      ) {

        monthlyMinutes +=
          minutesWorked;

      }

      if (
        record.hourly_rate !== null
      ) {

        totalPay +=
          (minutesWorked / 60) *
          Number(record.hourly_rate);

      }

      const row =
        document.createElement("tr");

      row.innerHTML = `

        <td>${record.work_date}</td>

        <td>
          ${record.farm_number || "-"}
        </td>

        <td>
          ${formatHours(minutesWorked)}
        </td>

        <td>
          ${
            record.hourly_rate === null
            ? "-"
            : "€" +
              (
                minutesWorked / 60 *
                Number(record.hourly_rate)
              ).toFixed(2)
          }
        </td>

      `;

      $("records")
        .appendChild(row);

    });


    $("totalHours").textContent =
      formatHours(totalMinutes);

    $("totalDays").textContent =
      records.length;

    $("totalPay").textContent =
      "€" + totalPay.toFixed(2);

    $("monthHours").textContent =
      formatHours(monthlyMinutes);

  }

  catch (error) {

    console.error(error);

    message(
      "Could not load your records. " +
      error.message,
      "error"
    );

  }

}


$("saveButton").onclick =
async function () {

  const totalMinutes =
    calculateHours();

  if (totalMinutes === null) {

    message(
      "Enter Work start and Work close.",
      "error"
    );

    return;

  }

  if (totalMinutes <= 0) {

    message(
      "Please check the times.",
      "error"
    );

    return;

  }


  const record = {

    farm_number:
      $("farm").value.trim() || null,

    work_date:
      $("date").value,

    work_start:
      $("start").value,

    break_start:
      $("breakStart").value || null,

    break_resume:
      $("breakEnd").value || null,

    work_close:
      $("close").value,

    total_minutes:
      totalMinutes,

    hourly_rate:
      $("rate").value === ""
      ? null
      : Number($("rate").value)

  };


  $("saveButton").disabled =
    true;

  $("saveButton").textContent =
    "Saving...";


  try {

    const response =
      await fetch(
        API,
        {
          method: "POST",
          headers: headers,
          body: JSON.stringify(record)
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }


    message(
      "Work day saved successfully.",
      "success"
    );


    $("farm").value = "";
    $("start").value = "";
    $("breakStart").value = "";
    $("breakEnd").value = "";
    $("close").value = "";
    $("rate").value = "";


    await loadRecords();

  }

  catch (error) {

    console.error(error);

    message(
      "Save failed: " + error.message,
      "error"
    );

  }

  finally {

    $("saveButton").disabled =
      false;

    $("saveButton").textContent =
      "Add Work Day";

  }

};


loadRecords();

</script>

</body>
</html>
