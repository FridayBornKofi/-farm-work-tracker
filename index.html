<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Work Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}.app{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:20px;box-shadow:0 4px 20px #0001}h1{margin:0 0 5px}.sub{color:#666;margin-bottom:20px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:17px}button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:600}.secondary{background:#eee;color:#111}.danger{background:#eee;color:#a00}.hidden{display:none}.msg{margin-top:12px;padding:10px;border-radius:9px}.ok{background:#e7f7e7}.err{background:#ffe7e7}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{margin:0;background:#eee;color:#111}.tabs .active{background:#111;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:#f1f1f1;padding:14px;border-radius:12px}.stat span{font-size:13px;color:#666}.stat strong{display:block;font-size:22px;margin-top:4px}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}th,td{text-align:left;padding:9px 3px;border-bottom:1px solid #eee}.user{font-size:13px;color:#666;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<h1>Farm Work Tracker</h1>
<div class="sub">Your records are private to your account.</div>

<div id="auth">
  <div class="tabs">
    <button id="loginTab" class="active">Log in</button>
    <button id="signupTab">Sign up</button>
  </div>
  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label>Password</label>
  <input id="password" type="password" placeholder="At least 6 characters">
  <button id="authBtn">Log in</button>
  <div id="authMsg"></div>
</div>

<div id="tracker" class="hidden">
  <div class="user" id="userText"></div>
  <button class="secondary" id="logout">Log out</button>

  <label>Farm number, optional</label>
  <input id="farm" type="text" placeholder="Example: Farm 12">
  <label>Date</label>
  <input id="date" type="date">
  <label>Work start</label>
  <input id="start" type="time">
  <label>Break starts</label>
  <input id="breakStart" type="time">
  <label>Resume from break</label>
  <input id="breakEnd" type="time">
  <label>Work close</label>
  <input id="close" type="time">
  <label>Hourly rate, optional (€)</label>
  <input id="rate" type="number" step="0.01" placeholder="Unknown">
  <button id="save">Add Work Day</button>
  <div id="msg"></div>

  <div class="stats">
    <div class="stat"><span>Total hours</span><strong id="total">0h 0m</strong></div>
    <div class="stat"><span>Days worked</span><strong id="days">0</strong></div>
    <div class="stat"><span>Total pay</span><strong id="pay">€0.00</strong></div>
    <div class="stat"><span>This month</span><strong id="month">0h 0m</strong></div>
  </div>

  <table>
    <thead><tr><th>Date</th><th>Farm</th><th>Hours</th><th>Pay</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
</div>

<script>
const SUPABASE_URL="https://uqjuwbddcbyoqyxlmkgg.supabase.co";
const SUPABASE_KEY="sb_publishable_1K6kwEhTHYJnM_OqA5Su6A_xrxejzh_";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

let signup=false;
$("signupTab").onclick=()=>{signup=true;$("signupTab").classList.add("active");$("loginTab").classList.remove("active");$("authBtn").textContent="Create account";$("authMsg").textContent=""};
$("loginTab").onclick=()=>{signup=false;$("loginTab").classList.add("active");$("signupTab").classList.remove("active");$("authBtn").textContent="Log in";$("authMsg").textContent=""};

$("authBtn").onclick=async()=>{
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){$("authMsg").innerHTML='<div class="msg err">Enter your email and password.</div>';return}
  $("authBtn").disabled=true;$("authBtn").textContent=signup?"Creating...":"Logging in...";
  try{
    const result=signup
      ? await supabase.auth.signUp({email,password})
      : await supabase.auth.signInWithPassword({email,password});
    if(result.error) throw result.error;
    if(signup && !result.data.session){
      $("authMsg").innerHTML='<div class="msg ok">Account created. Check your email to confirm it, then log in.</div>';
    } else {
      showTracker(result.data.session);
    }
  }catch(e){$("authMsg").innerHTML='<div class="msg err">'+e.message+'</div>'}
  finally{$("authBtn").disabled=false;$("authBtn").textContent=signup?"Create account":"Log in"}
};

async function showTracker(session){
  if(!session)return;
  $("auth").classList.add("hidden");$("tracker").classList.remove("hidden");
  $("userText").textContent="Logged in as "+(session.user.email||"");
  await load();
}
$("logout").onclick=async()=>{await supabase.auth.signOut();$("tracker").classList.add("hidden");$("auth").classList.remove("hidden")};

function minutes(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function duration(a,b){let x=minutes(b)-minutes(a);return x<0?x+1440:x}
function calc(){if(!$("start").value||!$("close").value)return null;let x=duration($("start").value,$("close").value);if($("breakStart").value&&$("breakEnd").value)x-=duration($("breakStart").value,$("breakEnd").value);return x}
function fmt(x){return Math.floor(x/60)+"h "+(x%60)+"m"}
function msg(text,type){$("msg").innerHTML=text?'<div class="msg '+type+'">'+text+'</div>':""}

async function load(){
  const {data,error}=await supabase.from("farm_work").select("*").order("work_date",{ascending:true}).order("created_at",{ascending:true});
  if(error){msg(error.message,"err");return}
  let total=0,month=0,pay=0,mk=new Date().toISOString().slice(0,7);
  $("rows").innerHTML="";
  data.forEach(r=>{
    const m=Number(r.total_minutes)||0;total+=m;
    if((r.work_date||"").slice(0,7)===mk)month+=m;
    if(r.hourly_rate!=null)pay+=m/60*Number(r.hourly_rate);
    const tr=document.createElement("tr");
    tr.innerHTML="<td>"+r.work_date+"</td><td>"+(r.farm_number||"-")+"</td><td>"+fmt(m)+"</td><td>"+(r.hourly_rate==null?"-":"€"+(m/60*Number(r.hourly_rate)).toFixed(2))+"</td>";
    $("rows").appendChild(tr);
  });
  $("total").textContent=fmt(total);$("days").textContent=data.length;$("pay").textContent="€"+pay.toFixed(2);$("month").textContent=fmt(month);
}

$("save").onclick=async()=>{
  const m=calc(); if(m===null){msg("Enter Work start and Work close.","err");return}
  if(m<=0){msg("Please check the times.","err");return}
  const {data:{user}}=await supabase.auth.getUser();
  if(!user){msg("Please log in again.","err");return}
  const record={
    user_id:user.id,
    farm_number:$("farm").value.trim()||null,
    work_date:$("date").value,
    work_start:$("start").value,
    break_start:$("breakStart").value||null,
    break_resume:$("breakEnd").value||null,
    work_close:$("close").value,
    total_minutes:m,
    hourly_rate:$("rate").value===""?null:Number($("rate").value)
  };
  $("save").disabled=true;$("save").textContent="Saving...";
  try{
    const {error}=await supabase.from("farm_work").insert(record);
    if(error)throw error;
    msg("Work day saved successfully.","ok");
    ["farm","start","breakStart","breakEnd","close","rate"].forEach(id=>$(id).value="");
    await load();
  }catch(e){msg(e.message,"err")}
  finally{$("save").disabled=false;$("save").textContent="Add Work Day"}
};

supabase.auth.getSession().then(({data})=>{if(data.session)showTracker(data.session)});
</script>
</body>
</html>
