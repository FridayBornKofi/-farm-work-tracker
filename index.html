<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Work Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:16px;
background:#f4f4f4;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#171717
}

.app{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:0 4px 20px rgba(0,0,0,.08)
}

h1{margin:0 0 5px}

.sub{
color:#666;
margin-bottom:20px
}

label{
display:block;
font-size:13px;
font-weight:600;
margin:12px 0 5px
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
font-size:17px
}

button{
width:100%;
padding:14px;
margin-top:14px;
border:0;
border-radius:10px;
background:#111;
color:#fff;
font-size:16px;
font-weight:600
}

button:disabled{
opacity:.55
}

.secondary{
background:#eee;
color:#111
}

.tabs{
display:flex;
gap:8px;
margin-bottom:15px
}

.tabs button{
margin:0;
background:#eee;
color:#111
}

.tabs .active{
background:#111;
color:#fff
}

.hidden{
display:none
}

.msg{
margin-top:12px;
padding:10px;
border-radius:9px
}

.ok{
background:#e7f7e7
}

.err{
background:#ffe7e7
}

.user{
font-size:13px;
color:#666;
margin-top:8px
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px
}

.stat{
background:#f1f1f1;
padding:14px;
border-radius:12px
}

.stat span{
font-size:13px;
color:#666
}

.stat strong{
display:block;
font-size:22px;
margin-top:4px
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
font-size:13px
}

th,td{
text-align:left;
padding:9px 3px;
border-bottom:1px solid #eee
}
</style>
</head>

<body>

<div class="app">

<h1>Farm Work Tracker</h1>

<div class="sub">
Track your farm hours and earnings.
</div>

<div id="loading">
Connecting...
</div>

<div id="auth">

<div class="tabs">

<button type="button" id="loginTab" class="active">
Log in
</button>

<button type="button" id="signupTab">
Sign up
</button>

</div>

<label>Email</label>

<input
id="email"
type="email"
autocomplete="email"
placeholder="you@example.com"
>

<label>Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="At least 6 characters"
>

<button type="button" id="authBtn">
Log in
</button>

<div id="authMsg"></div>

</div>


<div id="tracker" class="hidden">

<div class="user" id="userText"></div>

<button type="button" class="secondary" id="logout">
Log out
</button>


<label>Farm number, optional</label>

<input
id="farm"
type="text"
placeholder="Example: Farm 12"
>


<label>Date</label>

<input id="date" type="date">


<label>Work start</label>

<input id="start" type="time">


<label>Break starts</label>

<input id="breakStart" type="time">


<label>Resume from break</label>

<input id="breakEnd" type="time">


<label>Work close</label>

<input id="close" type="time">


<label>Hourly rate, optional (€)</label>

<input
id="rate"
type="number"
step="0.01"
placeholder="Unknown"
>


<button type="button" id="save">
Add Work Day
</button>

<div id="msg"></div>


<div class="stats">

<div class="stat">

<span>Total hours</span>

<strong id="total">
0h 0m
</strong>

</div>


<div class="stat">

<span>Days worked</span>

<strong id="days">
0
</strong>

</div>


<div class="stat">

<span>Total pay</span>

<strong id="pay">
€0.00
</strong>

</div>


<div class="stat">

<span>This month</span>

<strong id="month">
0h 0m
</strong>

</div>

</div>


<table>

<thead>

<tr>

<th>Date</th>

<th>Farm</th>

<th>Hours</th>

<th>Pay</th>

</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>


<script>

(function(){

"use strict";


const SUPABASE_URL =
"https://uqjuwbddcbyoqyxlmkgg.supabase.co";


const SUPABASE_KEY =
"sb_publishable_1K6kwEhTHYJnM_OqA5Su6A_xrxejzh_";


function $(id){

return document.getElementById(id);

}


$("date").value =
new Date().toISOString().slice(0,10);


if(!window.supabase){

$("loading").textContent =
"Connection failed. Please refresh.";

return;

}


const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


$("loading").textContent =
"Connected.";


let signup = false;


$("signupTab").onclick = function(){

signup = true;

$("signupTab").classList.add("active");

$("loginTab").classList.remove("active");

$("authBtn").textContent =
"Create account";

$("password").autocomplete =
"new-password";

$("authMsg").innerHTML = "";

};


$("loginTab").onclick = function(){

signup = false;

$("loginTab").classList.add("active");

$("signupTab").classList.remove("active");

$("authBtn").textContent =
"Log in";

$("password").autocomplete =
"current-password";

$("authMsg").innerHTML = "";

};


$("authBtn").onclick =
async function(){

const email =
$("email").value.trim();

const password =
$("password").value;


if(!email || !password){

$("authMsg").innerHTML =
'<div class="msg err">Enter your email and password.</div>';

return;

}


if(password.length < 6){

$("authMsg").innerHTML =
'<div class="msg err">Password must be at least 6 characters.</div>';

return;

}


$("authBtn").disabled = true;


$("authBtn").textContent =
signup
? "Creating..."
: "Logging in...";


try{

let result;


if(signup){

result =
await client.auth.signUp({
email:email,
password:password
});

}else{

result =
await client.auth.signInWithPassword({
email:email,
password:password
});

}


if(result.error){

throw result.error;

}


if(signup && !result.data.session){

$("authMsg").innerHTML =
'<div class="msg ok">Account created. Check your email, then log in.</div>';

}else if(result.data.session){

showTracker(result.data.session);

}


}catch(error){

$("authMsg").innerHTML =
'<div class="msg err">'
+
error.message
+
'</div>';

}


$("authBtn").disabled = false;

$("authBtn").textContent =
signup
? "Create account"
: "Log in";

};


async function showTracker(session){

if(!session){

return;

}


$("auth").classList.add("hidden");

$("tracker").classList.remove("hidden");

$("loading").textContent = "";

$("userText").textContent =
"Logged in as " +
session.user.email;


await load();

}


$("logout").onclick =
async function(){

await client.auth.signOut();

$("tracker").classList.add("hidden");

$("auth").classList.remove("hidden");

};


function minutes(time){

const parts =
time.split(":");

return Number(parts[0]) * 60 +
Number(parts[1]);

}


function duration(start,end){

let result =
minutes(end) -
minutes(start);

if(result < 0){

result += 1440;

}

return result;

}


function calculate(){

if(
!$("start").value ||
!$("close").value
){

return null;

}


let total =
duration(
$("start").value,
$("close").value
);


if(
$("breakStart").value &&
$("breakEnd").value
){

total -=
duration(
$("breakStart").value,
$("breakEnd").value
);

}


return total;

}


function formatHours(minutes){

return Math.floor(minutes / 60)
+
"h "
+
(minutes % 60)
+
"m";

}


function showMessage(text,type){

$("msg").innerHTML =
text
?
'<div class="msg '+type+'">'
+
text
+
'</div>'
:
"";

}


async function load(){

const result =
await client
.from("farm_work")
.select("*")
.order(
"work_date",
{ascending:true}
);


if(result.error){

showMessage(
result.error.message,
"err"
);

return;

}


const records =
result.data || [];


let total = 0;

let month = 0;

let pay = 0;


const currentMonth =
new Date()
.toISOString()
.slice(0,7);


$("rows").innerHTML = "";


records.forEach(function(record){

const worked =
Number(record.total_minutes) || 0;


total += worked;


if(
(record.work_date || "")
.startsWith(currentMonth)
){

month += worked;

}


if(record.hourly_rate != null){

pay +=
worked / 60 *
Number(record.hourly_rate);

}


const row =
document.createElement("tr");


row.innerHTML =

"<td>"
+
record.work_date
+
"</td>"

+

"<td>"
+
(record.farm_number || "-")
+
"</td>"

+

"<td>"
+
formatHours(worked)
+
"</td>"

+

"<td>"
+

(
record.hourly_rate == null
?
"-"
:
"€"
+
(
worked / 60 *
Number(record.hourly_rate)
).toFixed(2)
)

+

"</td>";


$("rows").appendChild(row);

});


$("total").textContent =
formatHours(total);


$("days").textContent =
records.length;


$("pay").textContent =
"€"
+
pay.toFixed(2);


$("month").textContent =
formatHours(month);

}


$("save").onclick =
async function(){

const worked =
calculate();


if(worked === null){

showMessage(
"Enter Work start and Work close.",
"err"
);

return;

}


if(worked <= 0){

showMessage(
"Please check the times.",
"err"
);

return;

}


const sessionResult =
await client.auth.getSession();


const session =
sessionResult.data.session;


if(!session){

showMessage(
"Please log in again.",
"err"
);

return;

}


const record = {

user_id:
session.user.id,

farm_number:
$("farm").value.trim() || null,

work_date:
$("date").value,

work_start:
$("start").value,

break_start:
$("breakStart").value || null,

break_resume:
$("breakEnd").value || null,

work_close:
$("close").value,

total_minutes:
worked,

hourly_rate:
$("rate").value === ""
?
null
:
Number($("rate").value)

};


$("save").disabled = true;

$("save").textContent =
"Saving...";


try{

const result =
await client
.from("farm_work")
.insert(record);


if(result.error){

throw result.error;

}


showMessage(
"Work day saved successfully.",
"ok"
);


[
"farm",
"start",
"breakStart",
"breakEnd",
"close",
"rate"
]
.forEach(function(id){

$(id).value = "";

});


await load();


}catch(error){

showMessage(
error.message,
"err"
);

}


$("save").disabled = false;

$("save").textContent =
"Add Work Day";

};


client.auth.getSession()
.then(function(result){

if(result.data.session){

showTracker(
result.data.session
);

}

});


})();
</script>

</body>
</html>
